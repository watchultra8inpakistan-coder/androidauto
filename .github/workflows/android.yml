name: Unzip and Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip project.zip -d extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Change wrapper permissions
      run: |
        cd extracted_project/CarLinkMirror
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        cd extracted_project/CarLinkMirror
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: extracted_project/CarLinkMirror/app/build/outputs/apk/debug/app-debug.apk
